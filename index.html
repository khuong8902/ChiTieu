
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chi Tiêu</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<meta name="theme-color" content="#2563EB">
</head>

<body>

<div id="splash">
    <div class="logo">💳</div>
    <h1>Chi Tiêu</h1>
</div>

<main id="app" class="hidden">

<h2>Quản lý chi tiêu</h2>

<div class="field">
    <input id="name" placeholder="Tên sản phẩm" autocomplete="off">
    <div id="suggestions"></div>
</div>

<div class="row">
    <input id="price" type="number" placeholder="Giá">
    <select id="currency">
        <option value="VND">VND</option>
        <option value="JPY">JPY</option>
    </select>
</div>

<div class="row">
    <input id="weight" type="number" placeholder="Trọng lượng">
    <div class="unitbox">g</div>
</div>

<input id="date" type="date">

<button id="save">ENTER</button>

<div class="toolbar">
    <button class="toolbtn" id="excel">
        ⬇ Xuất File Excel
    </button>
</div>

<input id="search" placeholder="🔍 Tìm sản phẩm">

<table>
<thead>
<tr>
    <th>Ngày</th>
    <th>Tên</th>
    <th>Giá</th>
</tr>
</thead>

<tbody id="rows"></tbody>

</table>

</main>

<script src="js/app.js"></script>

</body>
</html>
