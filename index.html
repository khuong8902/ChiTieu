<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Chi Tiêu</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#DCEFFF">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- Splash -->
<div id="splash" class="splash">
  <img src="icons/icon-192.png" class="splashIcon">
  <div class="splashText">Chi Tiêu</div>
</div>

<!-- ================= TRANG NHẬP LIỆU ================= -->
<div id="homePage" class="page">

  <!-- Header -->
  <div class="topBar">
    <input id="inputDate" type="date" class="dateTop">

    <button id="btnSetting" class="iconBtn">
      ⚙
    </button>
  </div>

  <!-- Tổng -->
  <div class="summaryGrid">

    <div class="summaryCard">
      <div class="summaryTitle">Hôm nay</div>
      <div id="todayTotal" class="summaryValue">0</div>
    </div>

    <div class="summaryCard">
      <div class="summaryTitle">Tháng này</div>
      <div id="monthTotal" class="summaryValue">0</div>
    </div>

  </div>

  <!-- Tên -->
  <div class="fieldWrap">

    <input
      id="productName"
      type="text"
      placeholder="Tên sản phẩm"
      autocomplete="off">

    <div id="suggestBox" class="suggestBox"></div>

  </div>

  <!-- Giá -->
  <input
    id="price"
    type="number"
    placeholder="Giá">

  <!-- SL -->
  <input
    id="quantity"
    type="number"
    placeholder="Số lượng">

  <!-- Trọng lượng -->
  <div class="weightRow">

    <input
      id="weight"
      type="number"
      placeholder="Trọng lượng">

    <div class="unitBox">g</div>

  </div>

  <!-- Enter -->
  <button id="btnSave" class="enterBtn">
    ENTER
  </button>

  <!-- Tổng tiền -->
  <div class="totalBox">

    <span>Tổng tiền</span>

    <strong id="totalPrice">0 JPY</strong>

  </div>

  <!-- Công cụ -->
  <div class="toolGrid">

  <button id="btnExcel" class="toolBtn">
    📄 Xuất Excel
  </button>

  <button id="btnStatistic" class="toolBtn">
    📊 Thống kê
  </button>

  <button id="btnBackup" class="toolBtn backupBtn">
    💾 Sao lưu
  </button>

  <button id="btnRestore" class="toolBtn restoreBtn">
    📂 Khôi phục
  </button>

</div>

<!-- Input ẩn để chọn file khôi phục -->
<input
  id="restoreFile"
  type="file"
  accept=".json"
  hidden>

  <!-- Search -->
  <input
    id="search"
    type="text"
    placeholder="Tìm sản phẩm...">

  <!-- Danh sách -->
  <div class="listArea">

    <table>

      <thead>

        <tr>

          <th style="width:34%">Ngày</th>

          <th>Tên</th>

          <th style="width:24%">Tiền</th>

        </tr>

      </thead>

      <tbody id="tableBody"></tbody>

    </table>

  </div>

</div>

<!-- ================= THỐNG KÊ ================= -->
<div id="statPage" class="page hidden">

  <!-- Header -->
  <div class="topBar">

    <button id="btnBack" class="iconBtn">
      ←
    </button>

    <div class="pageTitle">
      Thống kê
    </div>

    <div style="width:42px"></div>

  </div>

  <!-- 3 ô thống kê -->
  <div class="statGrid">

    <div class="statCard">

      <div class="statLabel">Tổng chi</div>

      <div id="statTotal" class="statValue red">
        0
      </div>

    </div>

    <div class="statCard">

      <div class="statLabel">Lượt mua</div>

      <div id="statCount" class="statValue blue">
        0
      </div>

    </div>

    <div class="statCard">

      <div class="statLabel">TB/ngày</div>

      <div id="statAvg" class="statValue green">
        0
      </div>

    </div>

  </div>

  <!-- Theo tháng -->
  <div id="monthPanel" class="pickerBar">

    <span>Tháng</span>

    <input id="monthPicker" type="month">

  </div>

  <!-- Theo năm -->
  <div id="yearPanel" class="pickerBar hidden">

    <span>Năm</span>

    <select id="yearPicker"></select>

  </div>

  <!-- Biểu đồ tháng -->
  <div id="monthChart" class="monthChart">

    <div id="leftBars" class="barColumn"></div>

    <div id="rightBars" class="barColumn"></div>

  </div>

  <!-- Biểu đồ năm -->
  <div id="yearChart" class="yearChart hidden"></div>

  <!-- Chi tiết -->
  <div id="detailPanel" class="detailPanel hidden">

    <div class="detailHeader">

      <div>

        <div id="detailDate" class="detailDate">
          18/09/2026
        </div>

        <div id="detailInfo" class="detailInfo">
          4 lượt mua • 3 sản phẩm
        </div>

      </div>

      <div id="detailTotal" class="detailMoney">
        ¥0
      </div>

    </div>

    <div id="detailList" class="detailList">

      <!-- JS render -->

    </div>

  </div>

  <!-- Bottom -->
  <div class="bottomTabs">

    <button
      id="tabMonth"
      class="tab active">
      Theo tháng
    </button>

    <button
      id="tabYear"
      class="tab">
      Theo năm
    </button>

  </div>

</div>

<!-- ================= CÀI ĐẶT ================= -->
<div id="settingModal" class="modal hidden">

  <div class="dialog">

    <h3>Cài đặt tiền tệ</h3>

    <button
      class="settingCurrency"
      data-value="JPY">
      JPY
    </button>

    <button
      class="settingCurrency"
      data-value="VND">
      VND
    </button>

    <button id="btnCloseSetting">
      Đóng
    </button>

  </div>

</div>
<!-- Toast -->
<div id="toast" class="toast hidden">

  <div class="toastBox">

    <span class="toastIcon">✅</span>

    <span id="toastText">
      Đã sao lưu vào bộ nhớ máy
    </span>

  </div>

</div>
<script src="lib/xlsx.full.min.js"></script>
<script src="js/app.js"></script>

</body>
</html>
