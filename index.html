<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chi Tiêu</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">

<meta name="theme-color" content="#2563EB">
</head>

<body>

<!-- Splash -->
<div id="splash">
    <div class="logo">💳</div>
    <h1>Chi Tiêu</h1>
</div>

<!-- ================= TRANG CHÍNH ================= -->
<main id="homePage" class="page hidden">

    <header class="topbar">
        <h1>Chi Tiêu</h1>

        <button id="btnSetting" class="iconBtn">
            ⚙️
        </button>
    </header>

    <!-- Thống kê -->
    <section class="summary">

        <div class="summaryBox">
            <span>Hôm nay</span>
            <h2 id="todayTotal">0</h2>
        </div>

        <div class="summaryBox">
            <span>Tháng này</span>
            <h2 id="monthTotal">0</h2>
        </div>

    </section>

    <!-- Tên sản phẩm -->
    <div class="field">

        <input
            id="productName"
            type="text"
            placeholder="Tên sản phẩm"
            autocomplete="off">

        <div id="suggestBox"></div>

    </div>

    <!-- Giá -->
    <input
        id="price"
        type="number"
        placeholder="Giá">

    <!-- Số lượng -->
    <input
        id="quantity"
        type="number"
        value="1"
        min="1"
        placeholder="Số lượng">

    <!-- Tổng tiền -->
    <div class="totalBox">

        <span>Tổng tiền</span>

        <strong id="totalPrice">
            0
        </strong>

    </div>

    <!-- Trọng lượng -->
    <div class="row">

        <input
            id="weight"
            type="number"
            placeholder="Trọng lượng">

        <div class="unit">
            g
        </div>

    </div>

    <!-- Ngày -->
    <input
        id="inputDate"
        type="date">

    <!-- Enter -->
    <button id="btnSave" class="primary">
        ENTER
    </button>

    <!-- Công cụ -->
    <div class="toolRow">

        <button id="btnExcel">
            📄 Xuất Excel
        </button>

        <button id="btnStatistic">
            📊 Thống kê
        </button>

    </div>

    <!-- Tìm kiếm -->
    <input
        id="search"
        type="text"
        placeholder="🔍 Tìm sản phẩm">

    <!-- Danh sách -->
    <table>

        <thead>

        <tr>
            <th>Ngày</th>
            <th>Tên</th>
            <th>Tổng</th>
        </tr>

        </thead>

        <tbody id="tableBody">
        </tbody>

    </table>

</main>

<!-- ================= THỐNG KÊ ================= -->
<main id="statPage" class="page hidden">

    <header class="topbar">

        <button id="btnBack" class="iconBtn">
            ←
        </button>

        <h1>Thống kê</h1>

        <div style="width:40px"></div>

    </header>

    <!-- Chọn tiền tệ -->
    <div class="currencySwitch">

        <button
            class="currencyBtn active"
            data-cur="JPY">
            JPY
        </button>

        <button
            class="currencyBtn"
            data-cur="VND">
            VND
        </button>

    </div>

    <!-- Line Chart -->
    <canvas
        id="lineChart"
        width="360"
        height="200">
    </canvas>

    <!-- Theo tuần tháng năm -->
    <div class="bottomTabs">

        <button
            class="modeBtn active"
            data-mode="week">
            Theo tuần
        </button>

        <button
            class="modeBtn"
            data-mode="month">
            Theo tháng
        </button>

        <button
            class="modeBtn"
            data-mode="year">
            Theo năm
        </button>

    </div>

</main>

<!-- ================= CÀI ĐẶT ================= -->
<div id="settingModal" class="modal hidden">

    <div class="dialog">

        <h3>Tiền tệ mặc định</h3>

        <button
            class="settingCurrency active"
            data-value="JPY">
            🇯🇵 JPY
        </button>

        <button
            class="settingCurrency"
            data-value="VND">
            🇻🇳 VND
        </button>

        <button id="btnCloseSetting">
            Đóng
        </button>

    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
