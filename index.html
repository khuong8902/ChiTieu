
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiêu</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <meta name="theme-color" content="#2563EB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- Splash -->
<div id="splash">
  <div class="logo">💳</div>
  <h1>Chi Tiêu</h1>
</div>

<!-- ===== MÀN HÌNH NHẬP LIỆU ===== -->
<main id="homePage" class="page hidden">

  <header class="topBar">
    <h2>Chi Tiêu</h2>
    <button id="btnSetting" class="iconBtn">⚙</button>
  </header>

  <section class="summary">
    <div class="card">
      <label>Hôm nay</label>
      <div id="todayTotal">0</div>
    </div>

    <div class="card">
      <label>Tháng này</label>
      <div id="monthTotal">0</div>
    </div>
  </section>

  <!-- Tên -->
  <div class="field">
    <input id="productName"
           type="text"
           placeholder="Tên sản phẩm"
           autocomplete="off">

    <div id="suggestBox"></div>
  </div>

  <!-- Giá -->
  <input id="price"
         type="number"
         placeholder="Giá">

  <!-- Số lượng -->
  <input id="quantity"
         type="number"
         placeholder="Số lượng">

  <!-- Trọng lượng -->
  <div class="row">
    <input id="weight"
           type="number"
           placeholder="Trọng lượng">

    <div class="unit">g</div>
  </div>

  <!-- Tổng tiền -->
  <div class="totalBox">
    <span>Tổng tiền</span>
    <strong id="totalPrice">0 JPY</strong>
  </div>

  <!-- Ngày -->
  <input id="inputDate" type="date">

  <!-- Enter -->
  <button id="btnSave" class="primary">
    ENTER
  </button>

  <!-- Công cụ -->
  <div class="toolRow">
    <button id="btnExcel">
      📄 Xuất Excel
    </button>

    <button id="btnStatistic">
      📊 Thống kê
    </button>
  </div>

  <!-- Search -->
  <input id="search"
         type="text"
         placeholder="🔍 Tìm sản phẩm">

  <!-- Table -->
  <table>
    <thead>
      <tr>
        <th>Ngày</th>
        <th>Tên</th>
        <th>Tổng</th>
      </tr>
    </thead>

    <tbody id="tableBody"></tbody>
  </table>

</main>

<!-- ===== MÀN HÌNH THỐNG KÊ ===== -->
<main id="statPage" class="page hidden">

  <header class="topBar">
    <button id="btnBack" class="iconBtn">←</button>
    <h2>Thống kê</h2>
    <div style="width:42px"></div>
  </header>

  <!-- Chọn tháng -->
  <div id="monthPanel" class="pickerRow">
    <label>Tháng</label>

    <input id="monthPicker"
           type="month">
  </div>

  <!-- Chọn năm -->
  <div id="yearPanel" class="pickerRow hidden">
    <label>Năm</label>

    <select id="yearPicker"></select>
  </div>

  <!-- Biểu đồ -->
  <canvas id="lineChart"
          width="360"
          height="220">
  </canvas>

  <!-- Bottom -->
  <div class="bottomTabs">
    <button class="modeBtn active"
            data-mode="month">
      Theo tháng
    </button>

    <button class="modeBtn"
            data-mode="year">
      Theo năm
    </button>
  </div>

</main>

<!-- ===== CÀI ĐẶT ===== -->
<div id="settingModal" class="modal hidden">

  <div class="dialog">

    <h3>Tiền tệ mặc định</h3>

    <button class="settingCurrency"
            data-value="JPY">
      🇯🇵 JPY
    </button>

    <button class="settingCurrency"
            data-value="VND">
      🇻🇳 VND
    </button>

    <button id="btnCloseSetting">
      Đóng
    </button>

  </div>

</div>

<script src="lib/xlsx.full.min.js"></script>
<script src="js/app.js"></script>

</body>
</html>
